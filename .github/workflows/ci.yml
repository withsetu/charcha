name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing about a contributor's machine or CI run needs to leave it.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full commit SHAs, not tags: a tag can be re-pointed by anyone
      # who gains write access to the action, and these steps run with this
      # repository's token. .github/dependabot.yml keeps the SHAs and the
      # trailing version comments current. Enforced by `npm run check:actions`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Worker types are current
        run: npm run types:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Embed bundle budget
        run: npm run check:size

      - name: Dependency licences
        run: npm run check:licences

      - name: Actions are SHA-pinned
        run: npm run check:actions

      # Two thresholds, not one: the production tree blocks at `low` because it
      # is what every self-deployer runs, and the dev tree blocks at `high`
      # because a gate that fires on a low-severity transitive dev advisory is a
      # gate people learn to route around. Reasoning in full on issue #23.
      #
      # Last in the job, and the only step beyond `npm ci` that needs the
      # network: a registry outage should not mask a real failure above it.
      - name: Dependency audit
        run: npm run check:audit
