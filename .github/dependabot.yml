# Actions in .github/workflows are pinned to full commit SHAs, which is the only
# immutable way to reference one. Pinning alone rots: the SHA stops moving, so it
# also stops picking up the action's own security fixes. Dependabot is the other
# half of that trade — it bumps the SHA and rewrites the trailing `# vX.Y.Z`
# comment with it.
#
# Sources:
#   https://docs.github.com/en/code-security/dependabot/working-with-dependabot/keeping-your-actions-up-to-date-with-dependabot
#   https://github.blog/changelog/2022-10-31-dependabot-now-updates-comments-in-github-actions-workflows-referencing-action-versions/
#
# Worth knowing, because it is easy to assume otherwise: Dependabot *alerts* do
# not cover SHA-pinned actions — "Dependabot only creates alerts for vulnerable
# actions that use semantic versioning and will not create alerts for actions
# pinned to SHA values"
# (https://docs.github.com/en/actions/reference/security/secure-use).
# Dependabot *version updates*, configured below, are what keeps these current.
#
# Two different Dependabot mechanisms are easy to confuse, so to be explicit
# about which one this file is:
#
#   Dependabot *security updates* — repo setting, already enabled on this
#     repository. Opens a PR when an advisory is published against something in
#     the tree. Nothing in this file configures it.
#   Dependabot *version updates* — this file. Routine bumps on a schedule,
#     advisory or not. It is the only one of the two that moves a SHA-pinned
#     action, because a pinned action has no version for an advisory to match.
#
# The JavaScript ecosystem is deliberately absent here. Security updates for it
# are already covered by the repo setting above, and routine dependency bumps
# need a changelog review per PR — a different piece of work from turning the
# scanning on, and tracked separately.
#
# When that is turned on, the ecosystem key is `npm` even though this project
# resolves with pnpm (#52): Dependabot files pnpm under the `npm` ecosystem and
# updates `pnpm-lock.yaml` from it. It supports pnpm v7–v10, which is one of the
# reasons `packageManager` pins the 10 line rather than 11.
# Source: https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories

version: 2
updates:
  - package-ecosystem: 'github-actions'
    # '/' means .github/workflows, not a directory literally named '/'.
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'area:infra'
      - 'security'
    commit-message:
      prefix: 'chore'
    groups:
      # One PR for the whole batch. These are all first-party `actions/*` steps
      # reviewed together, and a PR per action buries the signal.
      github-actions:
        patterns:
          - '*'
